[package]
name = "dbt-fragfinder"
description = "GUI for finding a player's standout moments in Diabotical demos"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dbt_fragfinder_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
scenefinder-core = { path = "../crates/scenefinder-core" }
