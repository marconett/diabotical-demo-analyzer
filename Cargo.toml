[workspace]
resolver = "2"
members = ["crates/scenefinder-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Inflating demos dominates the runtime, so dependencies are optimised even in
# dev builds (`tauri dev`).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
